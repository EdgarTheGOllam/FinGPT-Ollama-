<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Background</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0B0E14;
    }
    canvas#aurora {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="aurora"></canvas>

  <script>
    // ─────────────────────────────────────────────────────────────
    // Aurora WebGL Background – Vanilla JS / WebGL 1.0
    // Portiert aus dem React/OGL Original von reactbits.dev
    // Konfigurierbar via URL-Parameter:
    //   ?color0=%235227FF&color1=%237cff67&color2=%235227FF
    //   &amplitude=1.0&blend=0.5&speed=1.0
    // ─────────────────────────────────────────────────────────────

    const params = new URLSearchParams(window.location.search);

    function parseColor(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
      const n = parseInt(hex, 16);
      return [
        ((n >> 16) & 255) / 255,
        ((n >> 8)  & 255) / 255,
        ( n        & 255) / 255
      ];
    }

    const CONFIG = {
      color0:    decodeURIComponent(params.get('color0') ?? '5227FF'),
      color1:    decodeURIComponent(params.get('color1') ?? '7cff67'),
      color2:    decodeURIComponent(params.get('color2') ?? '5227FF'),
      amplitude: parseFloat(params.get('amplitude') ?? '1.0'),
      blend:     parseFloat(params.get('blend')     ?? '0.5'),
      speed:     parseFloat(params.get('speed')     ?? '1.0'),
    };

    // ── Vertex Shader ──────────────────────────────────────────────
    const VERT = `
      attribute vec2 aPosition;
      void main() {
        gl_Position = vec4(aPosition, 0.0, 1.0);
      }
    `;

    // ── Fragment Shader ────────────────────────────────────────────
    // Portiert 1:1 aus dem Original (WebGL 1.0 kompatibel)
    const FRAG = `
      #ifdef GL_ES
      precision highp float;
      #endif

      uniform float uTime;
      uniform float uAmplitude;
      uniform vec3  uColorStops[3];
      uniform vec2  uResolution;
      uniform float uBlend;

      vec3 permute(vec3 x) {
        return mod(((x * 34.0) + 1.0) * x, 289.0);
      }

      float snoise(vec2 v) {
        const vec4 C = vec4(
          0.211324865405187, 0.366025403784439,
          -0.577350269189626, 0.024390243902439
        );
        vec2 i  = floor(v + dot(v, C.yy));
        vec2 x0 = v - i + dot(i, C.xx);
        vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec4 x12 = x0.xyxy + C.xxzz;
        x12.xy -= i1;
        i = mod(i, 289.0);
        vec3 p = permute(
          permute(i.y + vec3(0.0, i1.y, 1.0))
          + i.x + vec3(0.0, i1.x, 1.0)
        );
        vec3 m = max(
          0.5 - vec3(
            dot(x0,       x0),
            dot(x12.xy,   x12.xy),
            dot(x12.zw,   x12.zw)
          ), 0.0
        );
        m = m * m * m * m;
        vec3 x = 2.0 * fract(p * C.www) - 1.0;
        vec3 h  = abs(x) - 0.5;
        vec3 ox = floor(x + 0.5);
        vec3 a0 = x - ox;
        m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
        vec3 g;
        g.x  = a0.x  * x0.x   + h.x  * x0.y;
        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
        return 130.0 * dot(m, g);
      }

      vec3 colorRamp(vec3 c0, vec3 c1, vec3 c2, float t) {
        // 3-Farb-Gradient: 0..0.5 = c0→c1, 0.5..1.0 = c1→c2
        if (t < 0.5) {
          return mix(c0, c1, t * 2.0);
        } else {
          return mix(c1, c2, (t - 0.5) * 2.0);
        }
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;

        vec3 rampColor = colorRamp(
          uColorStops[0],
          uColorStops[1],
          uColorStops[2],
          uv.x
        );

        float height = snoise(vec2(uv.x * 2.0 + uTime * 0.1, uTime * 0.25))
                       * 0.5 * uAmplitude;
        height = exp(height);
        height = (uv.y * 2.0 - height + 0.2);
        float intensity = 0.6 * height;

        float midPoint   = 0.20;
        float auroraAlpha = smoothstep(
          midPoint - uBlend * 0.5,
          midPoint + uBlend * 0.5,
          intensity
        );

        vec3 auroraColor = intensity * rampColor;
        gl_FragColor = vec4(auroraColor * auroraAlpha, auroraAlpha);
      }
    `;

    // ── WebGL Setup ────────────────────────────────────────────────
    (function initAurora() {
      const canvas = document.getElementById('aurora');
      const dpr    = Math.min(window.devicePixelRatio || 1, 2);

      // WebGL 1.0 (breite Kompatibilität)
      const gl = canvas.getContext('webgl', {
        alpha: true,
        premultipliedAlpha: true,
        antialias: true
      }) || canvas.getContext('experimental-webgl');

      if (!gl) {
        document.body.style.background = '#0B0E14';
        console.warn('[Aurora] WebGL nicht verfügbar – Fallback aktiv.');
        return;
      }

      gl.clearColor(0, 0, 0, 0);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

      // Shader kompilieren
      function compileShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          console.error('[Aurora] Shader-Fehler:', gl.getShaderInfoLog(s));
          gl.deleteShader(s);
          return null;
        }
        return s;
      }

      const vert = compileShader(gl.VERTEX_SHADER,   VERT);
      const frag = compileShader(gl.FRAGMENT_SHADER, FRAG);
      if (!vert || !frag) return;

      const program = gl.createProgram();
      gl.attachShader(program, vert);
      gl.attachShader(program, frag);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error('[Aurora] Link-Fehler:', gl.getProgramInfoLog(program));
        return;
      }
      gl.useProgram(program);

      // Fullscreen-Dreieck
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([-1, -1,  3, -1,  -1, 3]),
        gl.STATIC_DRAW
      );
      const posLoc = gl.getAttribLocation(program, 'aPosition');
      gl.enableVertexAttribArray(posLoc);
      gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

      // Uniform-Locations
      const uTime      = gl.getUniformLocation(program, 'uTime');
      const uAmplitude = gl.getUniformLocation(program, 'uAmplitude');
      const uColorStop = gl.getUniformLocation(program, 'uColorStops');
      const uResolution= gl.getUniformLocation(program, 'uResolution');
      const uBlend     = gl.getUniformLocation(program, 'uBlend');

      // Farben setzen
      const c0 = parseColor(CONFIG.color0);
      const c1 = parseColor(CONFIG.color1);
      const c2 = parseColor(CONFIG.color2);
      // WebGL 1.0: uniform vec3 array als flat Float32Array
      gl.uniform3fv(uColorStop, new Float32Array([
        c0[0], c0[1], c0[2],
        c1[0], c1[1], c1[2],
        c2[0], c2[1], c2[2],
      ]));

      gl.uniform1f(uAmplitude, CONFIG.amplitude);
      gl.uniform1f(uBlend,     CONFIG.blend);

      // Resize
      function resize() {
        const w = Math.floor(window.innerWidth  * dpr);
        const h = Math.floor(window.innerHeight * dpr);
        canvas.width  = w;
        canvas.height = h;
        canvas.style.width  = window.innerWidth  + 'px';
        canvas.style.height = window.innerHeight + 'px';
        gl.viewport(0, 0, w, h);
        gl.uniform2f(uResolution, window.innerWidth, window.innerHeight);
      }

      window.addEventListener('resize', resize);
      resize();

      // Render-Loop
      const startMs = performance.now();
      let raf;

      function render() {
        const t = ((performance.now() - startMs) / 1000) * CONFIG.speed * 0.1;
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.uniform1f(uTime, t);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        raf = requestAnimationFrame(render);
      }

      render();

      // JS-Bridge für Python-Seite
      window.Aurora = {
        setAmplitude: v => gl.uniform1f(uAmplitude, v),
        setBlend:     v => gl.uniform1f(uBlend,     v),
        setSpeed:     v => { CONFIG.speed = v; },
        setColors:    (h0, h1, h2) => {
          const a = parseColor(h0), b = parseColor(h1), cc = parseColor(h2);
          gl.uniform3fv(uColorStop, new Float32Array([
            a[0],a[1],a[2], b[0],b[1],b[2], cc[0],cc[1],cc[2]
          ]));
        },
        pause:  () => cancelAnimationFrame(raf),
        resume: () => render(),
      };
    })();
  </script>
</body>
</html>
